# Sirve la pagina y hace de puerta de entrada a los microservicios (mismo origen: el navegador no necesita CORS).
#   /api/<servicio>/<ruta>  ->  http://<servicio>:8000/<ruta>      (red de docker boleteria_nube_boleteria)
#   /api/modelo             ->  exportador de python ml/demo.py --exportar (puerto 9108 de la laptop)
server {
    listen 80;
    server_name _;

    # DNS de docker: los nombres se resuelven en cada pedido, asi nginx arranca aunque falte algun servicio
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    location = /index.html { add_header Cache-Control "no-store"; }

    # La pagina no puede tocar la inyeccion de fallas
    location ~ ^/api/[a-z]+/admin { return 403; }

    location ~ ^/api/(usuarios|eventos|reservaciones|pago|ticket|notificaciones)/(.*)$ {
        set $servicio $1;
        set $ruta $2;
        proxy_pass http://$servicio:8000/$ruta$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $servicio;
    }

    location = /api/modelo {
        proxy_pass http://host.docker.internal:9108/metrics;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store";
    }
}
