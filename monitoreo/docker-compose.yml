# Monitoreo opcional: Prometheus + Grafana con el tablero "Boleteria: ¿se esta muriendo algo?".
# Se levanta aparte de los servicios, solo cuando se quiere mirar (no durante las campanas):
#   docker compose -f monitoreo/docker-compose.yml up -d
#   docker compose -f monitoreo/docker-compose.yml down
# Grafana: http://localhost:3000 (sin login para mirar; admin / admin para editar)
# Prometheus: http://localhost:9090 (pestana Alerts)
# Necesita los servicios arriba (docker compose up -d) y, para las predicciones, python ml/demo.py corriendo.
name: boleteria_monitoreo

services:
  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - boleteria

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/boleteria.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - boleteria

  # Saca capturas del tablero (http://admin:admin@localhost:3000/render/d/boleteria?width=1600&height=1400).
  # Solo se usa para revisar el tablero; se puede apagar con: docker compose -f monitoreo/docker-compose.yml stop renderer
  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: grafana-renderer
    cpus: "1.0"
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - boleteria

networks:
  boleteria:
    external: true
    name: boleteria_nube_boleteria
