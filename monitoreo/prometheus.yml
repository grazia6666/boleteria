# Prometheus lee cada segundo los 6 servicios (sus /metrics) y la demo (python ml/demo.py publica en el 9108).
global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: servicios
    static_configs:
      - targets: [usuarios:8000, eventos:8000, reservaciones:8000, pago:8000, ticket:8000, notificaciones:8000]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: servicio
        replacement: "$1"

  - job_name: modelo
    static_configs:
      - targets: ["host.docker.internal:9108"]

  # una segunda demo para probar el tablero sin tocar la principal: python ml/demo.py --replay ... --exportar 9109
  # (en Grafana: ?var-job=modelo_prueba)
  - job_name: modelo_prueba
    static_configs:
      - targets: ["host.docker.internal:9109"]
